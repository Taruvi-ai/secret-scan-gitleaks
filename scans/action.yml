# Secret Scan: finds hardcoded secrets with gitleaks and fails the check if any are found.
# Mode (working tree / git history / both) comes from the manual dropdown, the caller, or the
# SECRET_SCAN_MODE variable; default is both. Rules: .gitleaks.toml.
name: Secret Scan
description: Scan the calling repository for hardcoded secrets with Gitleaks

inputs:
  scan_mode:
    description: What should be scanned
    required: false

runs:
  using: composite
  steps:
    - name: Decide what to scan
      shell: bash
      env:
        REQUESTED_MODE: ${{ inputs.scan_mode || vars.SECRET_SCAN_MODE }}
      run: |
        case "${REQUESTED_MODE:-Working tree + git history}" in
          "Working tree + git history") mode=both ;;
          "Working tree only")          mode=working-tree-only ;;
          "Git history only")           mode=git-history-only ;;
          *)
            echo "::error title=Invalid scan option::Unknown scan option '${REQUESTED_MODE}'. Use one of: Working tree + git history, Working tree only, Git history only. Set a valid scan_mode input in the caller workflow."
            exit 1
            ;;
        esac
        echo "SCAN_MODE=$mode" >> "$GITHUB_ENV"
        echo "Scan mode: $mode"

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # Installs Gitleaks. The final step decides pass/fail from both scan reports.
    - name: Install gitleaks (gitleaks-action)
      continue-on-error: true
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITLEAKS_CONFIG: ${{ github.action_path }}/.gitleaks.toml
        GITLEAKS_VERSION: "8.30.1"
        GITLEAKS_ENABLE_SUMMARY: "false"
        GITLEAKS_ENABLE_COMMENTS: "false"
        GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

    - name: Check gitleaks is available
      shell: bash
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "::error title=gitleaks is not installed::The gitleaks-action step did not install gitleaks. Check that the caller provides GITLEAKS_LICENSE."
          exit 1
        fi
        gitleaks version

    - name: Run gitleaks
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/secret-scan"
        rm -f results.sarif
        # Findings do not fail this step; the summary step decides.
        if [ "$SCAN_MODE" = "both" ] || [ "$SCAN_MODE" = "working-tree-only" ]; then
          gitleaks dir . --config "$GITHUB_ACTION_PATH/.gitleaks.toml" --redact --no-banner --log-level error \
            --exit-code 0 --report-format json --report-path "$RUNNER_TEMP/secret-scan/working-tree.json"
        fi
        if [ "$SCAN_MODE" = "both" ] || [ "$SCAN_MODE" = "git-history-only" ]; then
          gitleaks git . --config "$GITHUB_ACTION_PATH/.gitleaks.toml" --redact --no-banner --log-level error \
            --exit-code 0 --report-format json --report-path "$RUNNER_TEMP/secret-scan/git-history.json"
        fi

    - name: Summary, annotations and pass/fail
      shell: bash
      env:
        OUT_DIR: ${{ runner.temp }}/secret-scan
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        REPO_NAME: ${{ github.repository }}
        REF_NAME: ${{ github.ref_name }}
        COMMIT_SHA: ${{ github.sha }}
        ACTOR: ${{ github.actor }}
        EVENT: ${{ github.event_name }}
      run: |
        wt="$OUT_DIR/working-tree.json"
        hist="$OUT_DIR/git-history.json"
        do_wt=false; do_hist=false
        case "$SCAN_MODE" in
          both)              do_wt=true; do_hist=true; mode_text="current files and git history" ;;
          working-tree-only) do_wt=true; mode_text="current files only" ;;
          git-history-only)  do_hist=true; mode_text="git history only" ;;
        esac

        # A missing report means the scan itself broke: fail loudly, never pass silently.
        for need in "$do_wt:$wt" "$do_hist:$hist"; do
          if [ "${need%%:*}" = true ] && [ ! -f "${need#*:}" ]; then
            echo "::error title=Secret scan report missing::${need#*:} was not produced, so this scan cannot be trusted. Check the 'Run gitleaks' step."
            exit 2
          fi
        done

        n_wt=0; n_hist=0; f_wt=0; f_hist=0; g_hist=0
        if [ "$do_wt" = true ]; then
          n_wt=$(jq length "$wt"); f_wt=$(jq '[.[].File] | unique | length' "$wt")
        fi
        if [ "$do_hist" = true ]; then
          n_hist=$(jq length "$hist"); f_hist=$(jq '[.[].File] | unique | length' "$hist")
          g_hist=$(jq 'group_by([.File, .RuleID]) | length' "$hist")
        fi
        total=$((n_wt + n_hist))
        SHOW_WT=20      # current-file rows shown in the Summary tab
        SHOW_HIST=3     # git-history rows shown in the Summary tab (the rest are in the step log)

        # jq helpers. File names come from the repo, so they are escaped before they are
        # put into markdown or into workflow annotations.
        defs='
          def esc: gsub("%";"%25") | gsub("\r";"%0D") | gsub("\n";"%0A");
          def prop: esc | gsub(":";"%3A") | gsub(",";"%2C");
          def cell: gsub("[\r\n]";" ") | gsub("\\|";"/") | gsub("`";"") | gsub("<";"&lt;") | gsub(">";"&gt;");
          def path: ltrimstr("./");
          def rule_name: ({"taruvi-api-key":"Taruvi API key","hardcoded-password":"Hardcoded password","credentials-in-url":"Username and password in a URL","generic-api-key":"API key or other high-entropy secret","jwt":"JWT token","private-key":"Private key","curl-auth-header":"Credential in a curl header"})[.] // .;
          def rule_fix: ({"taruvi-api-key":"Revoke this key in Taruvi, create a new one and load it from an environment variable or CI secret.","hardcoded-password":"Move the password to an environment variable or secret store. Use a placeholder in examples.","credentials-in-url":"Keep user and password in separate environment variables and build the URL at runtime.","jwt":"Log out or revoke the token and keep auth files out of git (add them to .gitignore).","private-key":"Revoke the key pair, generate a new one and keep key files out of git.","curl-auth-header":"Use a variable such as $TARUVI_API_KEY or a placeholder in docs and scripts."})[.] // "Move the value to an environment variable or secret store. Rotate it if it is real.";
        '

        # ---- Summary tab: facts, result table, one explained table per scan ----
        {
          echo "## 🔐 Secret Scan Summary"
          echo ""
          echo "**Repository:** $REPO_NAME"
          echo "**Branch:** $REF_NAME"
          echo "**Commit:** \`$COMMIT_SHA\`"
          echo "**Author:** $ACTOR"
          echo "**Triggered by:** $EVENT"
          echo "**Scanned:** $mode_text"
          echo ""

          if [ "$total" -eq 0 ]; then
            echo "### ✅ No Secrets Found"
            echo ""
            echo "- ✅ Nothing that looks like a hardcoded key, token, password or credential URL was found ($mode_text)."
             echo "- ℹ️ Gitleaks matches patterns, so this is a safety net and not proof that the repo is clean."
          else
            echo "### ❌ Secrets Found"
            echo ""
            echo "The merge or release is blocked until these are fixed or accepted. Secret values are never shown, only where they are."
            echo ""
            echo "| Where | Findings | Files | What it means |"
            echo "|---|---|---|---|"
            if [ "$do_wt" = true ]; then echo "| Current files | **$n_wt** | $f_wt | In the code right now. Anyone with repo access can read them. |"; fi
            if [ "$do_hist" = true ]; then echo "| Git history | **$n_hist** | $f_hist | Committed in the past. They stay readable even if the file was deleted later. |"; fi
            echo ""

            if [ "$do_wt" = true ] && [ "$n_wt" -gt 0 ]; then
              echo "### Secrets in the current files"
              echo ""
              echo "| # | Location | What was found | How to fix |"
              echo "|---|---|---|---|"
              jq -r "$defs"".[0:$SHOW_WT] | to_entries[] | \"| \(.key + 1) | \`\(.value.File | path | cell)\` line \(.value.StartLine) | \(.value.RuleID | rule_name | cell) | \(.value.RuleID | rule_fix | cell) |\"" "$wt"
              if [ "$n_wt" -gt "$SHOW_WT" ]; then
                echo ""
                echo "➕ **$((n_wt - SHOW_WT)) more in the current files are not listed here.** Please look at them in the step log or the annotations."
              fi
              echo ""
            fi

            if [ "$do_hist" = true ] && [ "$n_hist" -gt 0 ]; then
              echo "### Secrets in the git history (top $SHOW_HIST)"
              echo ""
              echo "| # | File | What was found | Times | Latest | Example commit | What to do |"
              echo "|---|---|---|---|---|---|---|"
              jq -r --arg repo "$REPO_URL" "$defs"'
                group_by([.File, .RuleID]) | sort_by(-length) | .['"0:$SHOW_HIST"'] | to_entries[]
                | .key as $i | .value as $g
                | "| \($i + 1) | `\($g[0].File | path | cell)` | \($g[0].RuleID | rule_name | cell) | \($g | length) | \($g | map(.Date) | max | .[0:10]) | [\($g[0].Commit[0:7])](\($repo)/commit/\($g[0].Commit)) | \($g[0].RuleID | rule_fix | cell) Then remove it from history or add its fingerprint to `.gitleaksignore`. |"' "$hist"
              shown=$(jq --argjson k "$SHOW_HIST" 'group_by([.File, .RuleID]) | sort_by(-length) | .[0:$k] | map(length) | add // 0' "$hist")
              if [ "$g_hist" -gt "$SHOW_HIST" ]; then
                echo ""
                echo "➕ **$((g_hist - SHOW_HIST)) more file/type group(s), $((n_hist - shown)) more finding(s), are not listed here.** Please review the full list in the log of this step (group \"Full git history list\") and handle them the same way."
              fi
              echo ""
            fi

            echo "### What to do next"
            echo ""
            echo "1. **Rotate or revoke every real key first.** A key that was ever committed counts as leaked, even if the file was deleted."
            echo "2. **Current files:** remove the value and read it from an environment variable or a CI secret. Use a placeholder such as \`<YOUR_API_KEY>\` in examples."
            echo "3. **Git history:** after rotating, rewrite history (for example \`git filter-repo\`) or add the finding's fingerprint to \`.gitleaksignore\`."
            echo "4. **False alarm?** Add the file to the allowlist in \`.gitleaks.toml\`, or the fingerprint to \`.gitleaksignore\`, and get it reviewed."
          fi
        } > "$OUT_DIR/summary.md"

        cat "$OUT_DIR/summary.md"
        cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

        # ---- Step log only: the complete git-history list that the Summary tab does not show ----
        if [ "$n_hist" -gt 0 ]; then
          echo "::group::Full git history list ($g_hist file/type groups, $n_hist findings)"
          jq -r --arg repo "$REPO_URL" "$defs"'
            group_by([.File, .RuleID]) | sort_by(-length) | to_entries[]
            | "\(.key + 1). \(.value[0].File | path) | \(.value[0].RuleID | rule_name) | \(.value | length) time(s) | latest \(.value | map(.Date) | max | .[0:10]) | commits: \([.value[].Commit] | unique | .[0:3] | map(.[0:7]) | join(", "))"' "$hist"
          echo "::endgroup::"
          echo "::group::Fingerprints for .gitleaksignore (use only after the credential is rotated)"
          jq -r '.[].Fingerprint' "$hist"
          echo "::endgroup::"
        fi

        # ---- Annotations on the run page (GitHub shows at most 10 errors per step) ----
        if [ "$n_wt" -gt 0 ]; then
          jq -r "$defs"'.[0:7][] | "::error file=\(.File | path | prop),line=\(.StartLine),title=\("Hardcoded secret: " + (.RuleID | rule_name) | prop)::\("\(.RuleID | rule_name) found in a current file. Anyone with repo access can read it. Remove it, load it from an environment variable or secret store, and rotate it if it is real." | esc)"' "$wt"
        fi
        if [ "$n_hist" -gt 0 ]; then
          jq -r --argjson n "$n_hist" "$defs"'
            ([.[].File | path] | unique) as $files
            | "::error title=Secrets found in git history::\("\($n) secret(s) found in past commits, in \($files | length) file(s) (for example \($files[0:4] | join(", "))). Rotate those credentials, then clean the history or add the fingerprints to .gitleaksignore. The top 3 are in the Summary tab; the full list is in this step log." | esc)"' "$hist"
        fi

        if [ "$total" -gt 0 ]; then
          parts=""
          if [ "$do_wt" = true ]; then parts="$n_wt in current files"; fi
          if [ "$do_hist" = true ]; then parts="${parts:+$parts and }$n_hist in git history"; fi
          echo "::error title=Secret scan failed::Secret scan failed: $parts. The merge or release is blocked until these are fixed or accepted. Open the Summary tab of this run for locations and how to fix each one."
          exit 1
        fi
        echo "::notice title=Secret scan passed::No hardcoded secrets found ($mode_text)."
